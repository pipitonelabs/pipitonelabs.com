name: PR Docker Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and Smoke Test Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: pipitonelabs-pr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors the k8s securityContext: non-root, read-only root FS, /tmp writable
      - name: Run container
        run: |
          docker run -d --name blog -p 4321:4321 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            pipitonelabs-pr:test
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4321/ && break
            sleep 1
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4321$1")
            echo "$1 -> $code"
            [ "$code" = "$2" ]
          }
          check / 200
          check /rss.xml 200
          check /blog 200
          check /nonexistent 404
          img=$(curl -fsS http://127.0.0.1:4321/ | grep -oE '/_image\?[^"]+' | head -n1 | sed 's/&amp;/\&/g')
          test -n "$img"
          check "$img" 200
          docker exec blog ls node_modules/@img | tee /dev/stderr | grep -q linuxmusl

      - name: Container logs
        if: always()
        run: docker logs blog || true
